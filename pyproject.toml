[project]
name = "llm-nortaia"
version = "0.1.0"
description = "Scaffold para treino de um LLM em Portugues"
readme = "README.md"
authors = [{ name = "João C R Monteiro" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "transformers>=4.30.0",
    "datasets>=2.12.0",
    "python-dotenv",
    "tensorboard",
    "sentencepiece",
    "tokenizers",
    "torch>=2.13.0",
    "accelerate",
    "deepspeed",
    "peft",
    "wandb",
    "pyyaml",
    "tqdm",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
